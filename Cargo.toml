[package]
name = "ctc-forced-aligner-wgpu"
version = "0.1.0"
edition = "2021"
description = "omniASR-CTC forced alignment in Rust — wgpu and CPU inference, token-identical to the Python reference"
license = "Apache-2.0"

[lib]
name = "ctc_forced_aligner_wgpu"
path = "src/lib.rs"

[[bin]]
name = "align"
path = "src/bin/align.rs"

[dependencies]
wgpu = "30.0.1"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
memmap2 = "0.9"
bytes = "1.11"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
gemm = "0.18"
rayon = "1.10"
libm = "0.2"

[dev-dependencies]
criterion = "0.5"

[features]
default = []
# Count allocations in `alloc_stats::Stats`.  Off by default: the counters are
# three relaxed atomic RMWs per allocation, which the aligner does not need in
# a production run.  Build with `--features alloc-stats` and set
# CTC_ALLOC_STATS=1 to get the per-chunk live/peak report.
alloc-stats = []

[[bench]]
name = "rtfx"
harness = false

[profile.release]
debug = false
codegen-units = 1
lto = "thin"
