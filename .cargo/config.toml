# CPU inference kernels (gelu/LayerNorm/softmax elementwise loops) rely on
# AVX2+FMA codegen.  Every x86-64 CPU since Haswell (2013) has these, so the
# binary stays portable across modern x86-64 machines.  Scoped to x86_64
# targets so cross-compiling to other architectures still works.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-feature=+avx2,+fma"]
